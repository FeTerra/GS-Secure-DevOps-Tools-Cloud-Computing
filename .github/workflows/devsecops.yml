name: DevSecOps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform-validate:
    name: Validar infraestrutura Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v6
      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Verificar formatação
        run: terraform fmt -check -recursive
      - name: Inicializar provider sem backend
        run: terraform init -backend=false -input=false
      - name: Validar configuração EC2 de referência
        run: terraform validate -no-color
      - name: Validar módulo Terraform do Lightsail publicado
        working-directory: terraform/lightsail-live
        run: terraform init -backend=false -input=false && terraform validate -no-color

  security-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Definir nome da imagem em minúsculas
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Procurar segredos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Análise estática Semgrep
        run: docker run --rm --volume "$PWD:/src" --workdir /src semgrep/semgrep semgrep scan --config p/default --severity ERROR --error .
      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ponto-falante:${{ github.sha }}
      - name: Scan de vulnerabilidades Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ponto-falante:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Autenticar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
      - name: Assumir role AWS via OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Atualizar instância por AWS Systems Manager
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          command_id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript --parameters commands="set -e; docker pull $IMAGE; docker rm -f ponto-falante || true; docker run -d --name ponto-falante --restart unless-stopped -p 80:8000 $IMAGE" --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
