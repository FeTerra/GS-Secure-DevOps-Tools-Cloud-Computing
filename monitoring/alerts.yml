groups:
  - name: ponto-falante
    rules:
      - alert: MVPIndisponivel
        expr: up{job="ponto-falante"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Ponto Falante sem resposta no Prometheus"
      - alert: LatenciaElevada
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Latência p95 acima de 1 segundo por 5 minutos"
